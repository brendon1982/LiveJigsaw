<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Jigsaw</title>
    <style>
      #startup-loading {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        background: #000;
        color: #edf3e9;
        font: 1rem system-ui, sans-serif;
      }

      .startup-spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid #71897e;
        border-top-color: #c7e1d1;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }

      @keyframes startup-spin {
        to { transform: rotate(1turn); }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="startup-loading" role="status">
      <span class="startup-spinner" aria-hidden="true"></span>
      <span>Loading Live Jigsaw…</span>
    </div>
    <main id="game" aria-label="Live Jigsaw"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

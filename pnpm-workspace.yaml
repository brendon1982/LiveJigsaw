allowBuilds:
  esbuild: true

patchedDependencies:
  phaser4-rex-plugins@4.2.0: patches/phaser4-rex-plugins@4.2.0.patch

permissions:
  phaser:
    skills: [actions-and-utilities, animations, audio-and-sound, cameras, curves-and-paths, data-manager, events-system, filters-and-postfx, game-object-components, game-setup-and-config, geometry-and-math, graphics-and-shapes, groups-and-containers, input-keyboard-mouse-touch, loading-assets, particles, physics-arcade, physics-matter, render-textures, scale-and-responsive, scenes, sprites-and-images, text-and-bitmaptext, tilemaps, time-and-timers, tweens, v3-to-v4-migration, v4-new-features]
  phaser4-rex-plugins:
    skills: [rexboard-board-and-chess, rexboard-components-catalog, rexboard-grids-and-coordinates, rexboard-map-generation-and-import, rexboard-match-and-puzzle, rexboard-miniboard-and-composite, rexboard-movement-and-pathfinding, rexboard-rendered-tiles-and-pieces, rexboard-setup-and-factory, rexboard-visibility-and-routes, rexui-basic-widgets, rexui-components-catalog, rexui-dialogs-and-popups, rexui-interactions-and-effects, rexui-layout-sizers, rexui-scroll-lists-and-tables, rexui-setup-and-factory, rexui-shapes-and-states, rexui-text-and-input]

skills:
  dirs:
    - .agents/skills

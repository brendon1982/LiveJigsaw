<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Jigsaw compact board fixture</title>
  </head>
  <body>
    <main id="game"></main>
    <script type="module">
      import { pieceShapeIds, puzzleSizePresets } from '../../src/domain/puzzleSizes';
      import { puzzleSources } from '../../src/puzzles/catalog';
      import { LandingScene } from '../../src/ui/LandingScene';
      import { SelectPuzzleScene } from '../../src/ui/SelectPuzzleScene';

      // Keep Windmill first on screen for the fixed-coordinate gameplay scenarios.
      puzzleSources.reverse();
      const createPicker = SelectPuzzleScene.prototype.create;
      SelectPuzzleScene.prototype.create = function () {
        createPicker.call(this);
        window.puzzlePickerScene = this;
      };
      const createLanding = LandingScene.prototype.create;
      LandingScene.prototype.create = function () {
        createLanding.call(this);
        window.puzzleLandingScene = this;
        if (!new URLSearchParams(location.search).has('landing')) this.scene.start(SelectPuzzleScene.key);
      };

      // Keep the compact board for fixed-coordinate interaction scenarios only.
      const fixedSizes = [
        { width: 512, height: 288, columns: 4, rows: 2, snapTolerance: 28 },
        { width: 1024, height: 576, columns: 8, rows: 4, snapTolerance: 28 },
        { width: 1024, height: 576, columns: 8, rows: 8, snapTolerance: 18 },
        { width: 1024, height: 576, columns: 16, rows: 8, snapTolerance: 16 },
      ];
      if (!new URLSearchParams(location.search).has('currentSizes')) {
        puzzleSizePresets.splice(0, puzzleSizePresets.length,
          ...fixedSizes.map((size) => Object.fromEntries(pieceShapeIds.map((shape) => [shape, size]))));
      }
      for (const { scene } of puzzleSources) {
        const create = scene.prototype.create;
        scene.prototype.create = function (data) {
          create.call(this, data);
          window.puzzleArtworkScene = this;
        };
      }
      await import('../../src/main');
    </script>
  </body>
</html>

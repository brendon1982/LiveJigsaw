<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Jigsaw picker fixture</title>
  </head>
  <body>
    <main id="game"></main>
    <script type="module">
      import Phaser from 'phaser';
      import { puzzleSources } from '../../src/puzzles/catalog';
      import { LandingScene } from '../../src/ui/LandingScene';
      import { SelectPuzzleScene } from '../../src/ui/SelectPuzzleScene';

      const previewColor = 0xff00ff;
      class OversizedPreviewScene extends Phaser.Scene {
        static key = 'OversizedPreview';

        constructor() {
          super(OversizedPreviewScene.key);
        }

        create({ width, height, seed, animationSpeed }) {
          if (!Number.isInteger(seed) || seed < 0 || seed > 0xffffffff) {
            throw new Error('Expected a puzzle seed in the source scene data');
          }
          window.sourceAnimationSpeed = animationSpeed;
          this.add.rectangle(0, 0, width, height, previewColor).setOrigin(0);
        }
      }

      puzzleSources[1] = { ...puzzleSources[1], attribution: { name: ' ', sourceUrl: 'https://example.com/lighthouse' } };
      puzzleSources.splice(2, puzzleSources.length - 2, {
        title: 'Oversized preview',
        tags: { theme: 'Coast', type: 'Flat Illustration' },
        motion: 'Animated',
        maxViewport: { width: 1920, height: 1080 },
        scene: OversizedPreviewScene,
        drawPreview(scene, { width, height }) {
          const graphics = scene.add.graphics();
          graphics.fillStyle(previewColor).fillRect(-40, -40, width + 80, height + 80);
          return [graphics];
        },
      });
      // Display Windmill, Lighthouse, and Oversized preview in that order for the layout checks.
      puzzleSources.reverse();

      const createLanding = LandingScene.prototype.create;
      LandingScene.prototype.create = function (data) {
        createLanding.call(this, data);
        this.scene.start(SelectPuzzleScene.key);
      };

      await import('../../src/main');
    </script>
  </body>
</html>
